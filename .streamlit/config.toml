[theme]
base = "light"
primaryColor = "#0f6455"
backgroundColor = "#f3f6f2"
secondaryBackgroundColor = "#fcfdfb"
textColor = "#142621"
font = "sans serif"
baseRadius = "medium"
borderColor = "#d7e2dc"
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#102a24"
secondaryBackgroundColor = "#17372f"
textColor = "#e8f2ed"

[server]
enableCORS = true
enableXsrfProtection = true

[client]
showErrorDetails = "none"
